<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track your order · unorgnl.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20261011004924">
</head>
<body data-page="track">
<main class="track">
  <h1 class="display">track your order</h1>
  <p class="track-lede">Enter the order number from your confirmation and the mobile number you ordered with.</p>
  <form id="track-form" class="track-form co-form" novalidate>
    <div class="co-field"><label for="t-no">Order number</label><div class="co-input"><input id="t-no" name="no" placeholder="UNO-12345" autocomplete="off" required></div></div>
    <div class="co-field"><label for="t-phone">Mobile number</label><div class="co-input co-prefix"><span class="co-cc">+91</span><input id="t-phone" name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" required></div></div>
    <button class="btn btn-orange btn-block" type="submit">Find my order</button>
  </form>
  <div id="track-result" aria-live="polite"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/data.js?v=20261011004924"></script>
<script src="js/garments.js?v=20261011004924"></script>
<script src="js/app.js?v=20261011004924"></script>
</body>
</html>
