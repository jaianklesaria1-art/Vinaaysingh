<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build your fit · unorgnl.</title>
<meta name="description" content="Mix and match unorgnl. tops and bottoms in the fitting room, then bag the whole outfit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20261011170806">
</head>
<body data-page="fit">
<main class="fit-page">
  <div class="fp-looks">
    <p class="fp-looks-label">Start from a look</p>
    <div class="fp-looks-row" id="fp-looks"></div>
  </div>
  <!-- Build your fit: a fitting room. Rails of pieces, an arched mirror you can turn, a swing tag with sizes -->
  <section class="fit" id="fit" aria-labelledby="fit-title">
    <h2 class="display section-title fit-title" id="fit-title">build your fit</h2>
    <div class="fit-side">
      <p class="fit-lede">Pick a top and a bottom. Drag the mirror to turn the outfit.</p>
      <div class="fit-rail"><h3>Tops</h3><div class="fit-rail-list" id="fit-tops" role="radiogroup" aria-label="Choose a top"></div></div>
      <div class="fit-rail"><h3>Bottoms</h3><div class="fit-rail-list" id="fit-bottoms" role="radiogroup" aria-label="Choose a bottom"></div></div>
    </div>
    <div class="fit-mirror" id="fit-mirror" tabindex="0" aria-label="Outfit preview. Drag, or use the left and right arrow keys, to turn it.">
      <div class="fit-figure">
        <div class="fit-piece top" id="fit-top"></div>
        <div class="fit-piece bottom" id="fit-bottom"></div>
      </div>
      <span class="fit-floor" aria-hidden="true"></span>
      <span class="fit-hint" aria-hidden="true">drag to turn</span>
    </div>
    <div class="fit-tag" aria-label="Your fit">
      <span class="fit-tag-hole" aria-hidden="true"></span>
      <span class="fit-tag-mark" aria-hidden="true"><i>u</i>norgnl.</span>
      <h3 class="fit-tag-title">Your fit</h3>
      <div class="fit-pick" data-slot="top"><div class="fit-pick-row"><a class="fit-name" id="fit-top-name" href="#"></a><span class="fit-price" id="fit-top-price"></span></div>
        <div class="fit-sizes" id="fit-top-sizes" role="group" aria-label="Top size"></div></div>
      <div class="fit-pick" data-slot="bottom"><div class="fit-pick-row"><a class="fit-name" id="fit-bottom-name" href="#"></a><span class="fit-price" id="fit-bottom-price"></span></div>
        <div class="fit-sizes" id="fit-bottom-sizes" role="group" aria-label="Bottom size"></div></div>
      <div class="fit-total"><span>Total</span><b id="fit-total"></b></div>
      <p class="fit-error" id="fit-error" role="alert"></p>
      <button class="btn btn-orange btn-block" type="button" id="fit-add" data-cta="Bag both">Add the fit</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/data.js?v=20261011170806"></script>
<script src="js/garments.js?v=20261011170806"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="js/cloth.js?v=20261011170806"></script>
<script src="js/tear-ticket.js?v=20261011170806"></script>
<script src="js/app.js?v=20261011170806"></script>
</body>
</html>
